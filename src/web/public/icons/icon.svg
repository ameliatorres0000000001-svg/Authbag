<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="50%" stop-color="#0A0A0D"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E8B7"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA820A"/>
      <stop offset="100%" stop-color="#EAC86B"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C365"/>
      <stop offset="50%" stop-color="#8A6E27"/>
      <stop offset="100%" stop-color="#FDF0CD"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Outer luxury geometric border -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#goldStroke)" stroke-width="2.5" opacity="0.65"/>
  <rect x="36" y="36" width="440" height="440" rx="76" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.25"/>

  <!-- Subtle corner diamond accents -->
  <polygon points="256,40 262,48 256,56 250,48" fill="url(#goldGrad)" opacity="0.8"/>
  <polygon points="256,456 262,464 256,472 250,464" fill="url(#goldGrad)" opacity="0.8"/>
  <polygon points="40,256 48,262 56,256 48,250" fill="url(#goldGrad)" opacity="0.8"/>
  <polygon points="456,256 464,262 472,256 464,250" fill="url(#goldGrad)" opacity="0.8"/>

  <!-- Centered HA Monogram Geometric Luxury Crest -->
  <g transform="translate(0, 0)">
    <!-- Central interlocking HA Monogram -->
    <!-- 'H' Left Pillar -->
    <path d="M 148 130 L 176 130 L 176 340 L 148 340 Z" fill="url(#goldGrad)"/>
    <!-- 'H' Serif caps -->
    <path d="M 136 130 L 188 130 L 188 138 L 136 138 Z" fill="url(#goldGrad)"/>
    <path d="M 136 332 L 188 332 L 188 340 L 136 340 Z" fill="url(#goldGrad)"/>

    <!-- 'H' Crossbar linking with 'A' crossbar -->
    <path d="M 176 226 L 314 226 L 314 240 L 176 240 Z" fill="url(#goldGrad)"/>

    <!-- 'H' Right Pillar / Intersecting with A diagonal -->
    <path d="M 238 130 L 266 130 L 266 340 L 238 340 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <path d="M 226 130 L 278 130 L 278 138 L 226 138 Z" fill="url(#goldGrad)"/>
    <path d="M 226 332 L 278 332 L 278 340 L 226 340 Z" fill="url(#goldGrad)"/>

    <!-- 'A' Apex & Diagonal Leg -->
    <!-- Apex diagonal left overlapping behind H -->
    <path d="M 314 126 L 338 126 L 382 340 L 352 340 L 326 210 Z" fill="url(#goldGrad)"/>
    <!-- 'A' Serif base right -->
    <path d="M 340 332 L 392 332 L 392 340 L 340 340 Z" fill="url(#goldGrad)"/>

    <!-- Dynamic Luxury Diamond Seal at Center of Monogram -->
    <polygon points="302,233 310,243 302,253 294,243" fill="#FFF2CE" filter="url(#subtleGlow)"/>

    <!-- Verification Starburst / Authenticity Hallmark -->
    <path d="M 256 94 Q 256 108 266 108 Q 256 108 256 122 Q 256 108 246 108 Q 256 108 256 94 Z" fill="url(#goldGrad)"/>

    <!-- Micro Authentic Seal Arc -->
    <text x="256" y="386" font-family="'Cinzel', 'Playfair Display', 'Didot', serif" font-size="19" font-weight="700" letter-spacing="9" fill="#E6C875" text-anchor="middle">AUTHENTIC</text>
    <line x1="168" y1="400" x2="344" y2="400" stroke="url(#goldStroke)" stroke-width="1.2" opacity="0.7"/>
    <text x="256" y="420" font-family="'Cinzel', 'Trajan Pro', sans-serif" font-size="10" font-weight="500" letter-spacing="5" fill="#A89A7E" text-anchor="middle">VERIFIED INTELLIGENCE</text>
  </g>
</svg>