<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Anajak Secondhand: a gold handbag carrying the letter A, inside a ring of two arrows (a bag's second life) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1712"/><stop offset="0.55" stop-color="#0d0b09"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9e8b7"/><stop offset="0.4" stop-color="#d4af37"/><stop offset="0.75" stop-color="#a7801c"/><stop offset="1" stop-color="#eac86b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#f2ca50" stop-opacity="0.22"/><stop offset="1" stop-color="#f2ca50" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- ring of two arrows -->
  <g fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round">
    <path d="M100.1 195.3 A172 172 0 0 1 391.5 162.1"/>
    <path d="M411.9 340.7 A172 172 0 0 1 120.5 373.9"/>
  </g>
  <path d="M410.0 185.7 L372.1 169.7 L403.6 145.1 Z" fill="url(#gold)"/>
  <path d="M102.0 350.3 L139.9 366.3 L108.4 390.9 Z" fill="url(#gold)"/>
  <!-- handbag -->
  <path d="M216 214 C216 172 296 172 296 214" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
  <path d="M184 216 H328 L346 340 Q348 354 334 354 H178 Q164 354 166 340 Z" fill="none" stroke="url(#gold)" stroke-width="11" stroke-linejoin="round"/>
  <!-- letter A -->
  <path d="M256 240 L224 324 M256 240 L288 324 M236 296 H276" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
